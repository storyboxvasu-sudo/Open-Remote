name: Build macOS Standalone DMGs

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS ${{ matrix.name }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel-x64
            target: x86_64-apple-darwin
            dmg_name: OpenRemote-Intel-x64.dmg
          - name: AppleSilicon-arm64
            target: aarch64-apple-darwin
            dmg_name: OpenRemote-AppleSilicon-arm64.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Stable & Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Ensure Darwin Target Added
        run: |
          rustup target add ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Frontend Dependencies
        working-directory: app-ui
        run: pnpm install

      - name: Build SvelteKit Frontend
        working-directory: app-ui
        run: pnpm build

      - name: Build Tauri macOS DMG
        working-directory: app-ui
        env:
          RUST_BACKTRACE: 1
        run: |
          pnpm tauri build --target ${{ matrix.target }} --verbose

      - name: Locate and Rename DMG Artifact
        run: |
          mkdir -p artifacts
          DMG_FILE=$(find target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -n 1)
          if [ -z "$DMG_FILE" ]; then
            DMG_FILE=$(find target/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -n 1)
          fi
          if [ -z "$DMG_FILE" ]; then
            DMG_FILE=$(find . -name "*.dmg" 2>/dev/null | head -n 1)
          fi
          echo "Found DMG file: $DMG_FILE"
          if [ -z "$DMG_FILE" ]; then
            echo "ERROR: No DMG file was generated by Tauri!"
            exit 1
          fi
          cp "$DMG_FILE" "artifacts/${{ matrix.dmg_name }}"
          echo "Artifact created at: artifacts/${{ matrix.dmg_name }}"
          ls -la artifacts/

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dmg_name }}
          path: artifacts/${{ matrix.dmg_name }}
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/${{ matrix.dmg_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
