name: Build macOS Standalone DMGs

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS ${{ matrix.name }}
    runs-on: macos-14
    env:
      CC: /usr/bin/clang
      CXX: /usr/bin/clang++
      AR: /usr/bin/ar
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel-x64
            target: x86_64-apple-darwin
            arch: x86_64
            cflags: "-arch x86_64"
            platform_key: darwin-x86_64
            dmg_name: OpenRemote-Intel-x64.dmg
            tar_name: OpenRemote-Intel-x64.app.tar.gz
          - name: AppleSilicon-arm64
            target: aarch64-apple-darwin
            arch: arm64
            cflags: "-arch arm64"
            platform_key: darwin-aarch64
            dmg_name: OpenRemote-AppleSilicon-arm64.dmg
            tar_name: OpenRemote-AppleSilicon-arm64.app.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Stable & Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Ensure Darwin Target Added
        run: |
          rustup target add ${{ matrix.target }}

      - name: Verify macOS Toolchain
        run: |
          echo "=== Xcode Clang Version ==="
          /usr/bin/clang --version
          which clang
          which /usr/bin/clang
          echo "=== Installed Rust Targets ==="
          rustup target list --installed

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Frontend Dependencies
        working-directory: app-ui
        run: pnpm install

      - name: Build SvelteKit Frontend
        working-directory: app-ui
        run: pnpm build

      - name: Configure macOS Native Clang Environment
        run: |
          echo "=== Configuring Native Clang Toolchain for ${{ matrix.name }} ==="
          # Sanitize environment: Ensure no foreign / Windows / MSVC flags exist
          unset CC_FORCE_DISABLE TARGET_CC TARGET_CFLAGS TARGET_AR
          echo "Using Clang at: $(which /usr/bin/clang)"
          /usr/bin/clang --version
          echo "Target architecture: ${{ matrix.arch }}"
          echo "CFLAGS: ${{ matrix.cflags }}"

      - name: Build Tauri macOS DMG & Updater Bundle
        working-directory: app-ui
        env:
          RUST_BACKTRACE: 1
          # Enforce system Xcode Clang and architecture
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
          AR: /usr/bin/ar
          CFLAGS: ${{ matrix.cflags }}
          CXXFLAGS: ${{ matrix.cflags }}
          # Target-specific environment variables consumed by cc-rs (used by objc2-exception-helper)
          CC_x86_64_apple_darwin: /usr/bin/clang
          CXX_x86_64_apple_darwin: /usr/bin/clang++
          CFLAGS_x86_64_apple_darwin: "-arch x86_64"
          AR_x86_64_apple_darwin: /usr/bin/ar
          CC_aarch64_apple_darwin: /usr/bin/clang
          CXX_aarch64_apple_darwin: /usr/bin/clang++
          CFLAGS_aarch64_apple_darwin: "-arch arm64"
          AR_aarch64_apple_darwin: /usr/bin/ar
          # Ensure Windows/MSVC include/lib variables are empty
          INCLUDE: ""
          LIB: ""
          # Tauri Auto-Updater Signing Keys
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD || '' }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD || '' }}
        run: |
          pnpm tauri build --target ${{ matrix.target }} --verbose

      - name: Locate and Collect Release Artifacts
        run: |
          mkdir -p artifacts

          # 1. Collect Standalone DMG
          DMG_FILE=$(find target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -n 1)
          if [ -z "$DMG_FILE" ]; then
            DMG_FILE=$(find target/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -n 1)
          fi
          if [ -z "$DMG_FILE" ]; then
            DMG_FILE=$(find . -name "*.dmg" 2>/dev/null | head -n 1)
          fi
          echo "Found DMG file: $DMG_FILE"
          if [ -n "$DMG_FILE" ]; then
            cp "$DMG_FILE" "artifacts/${{ matrix.dmg_name }}"
            echo "DMG created at: artifacts/${{ matrix.dmg_name }}"
          fi

          # 2. Collect Updater Bundle (.app.tar.gz and .sig)
          TAR_FILE=$(find target/${{ matrix.target }}/release/bundle/macos -name "*.app.tar.gz" 2>/dev/null | head -n 1)
          if [ -z "$TAR_FILE" ]; then
            TAR_FILE=$(find target/release/bundle/macos -name "*.app.tar.gz" 2>/dev/null | head -n 1)
          fi
          SIG_FILE=$(find target/${{ matrix.target }}/release/bundle/macos -name "*.app.tar.gz.sig" 2>/dev/null | head -n 1)
          if [ -z "$SIG_FILE" ]; then
            SIG_FILE=$(find target/release/bundle/macos -name "*.app.tar.gz.sig" 2>/dev/null | head -n 1)
          fi

          if [ -n "$TAR_FILE" ] && [ -n "$SIG_FILE" ]; then
            cp "$TAR_FILE" "artifacts/${{ matrix.tar_name }}"
            cp "$SIG_FILE" "artifacts/${{ matrix.tar_name }}.sig"
            echo "Updater archive: artifacts/${{ matrix.tar_name }}"
            echo "Updater signature: artifacts/${{ matrix.tar_name }}.sig"

            # 3. Generate / Update latest.json
            node scripts/update-latest-json.js \
              "${{ matrix.platform_key }}" \
              "artifacts/${{ matrix.tar_name }}.sig" \
              "${{ matrix.tar_name }}"
          else
            echo "Notice: Updater artifacts not generated (check if TAURI_PRIVATE_KEY is configured)."
          fi

          echo "=== Artifacts Directory Contents ==="
          ls -la artifacts/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dmg_name }}
          path: artifacts/*
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
