name: Build Windows Installers & Updater

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Stable & Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Frontend Dependencies
        working-directory: app-ui
        run: pnpm install

      - name: Build SvelteKit Frontend
        working-directory: app-ui
        run: pnpm build

      - name: Build Tauri Windows Installer & Updater Bundle
        working-directory: app-ui
        env:
          RUST_BACKTRACE: 1
          # Tauri Auto-Updater Signing Keys
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_KEY_PASSWORD || '' }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_KEY_PASSWORD || '' }}
        run: |
          pnpm tauri build --target x86_64-pc-windows-msvc --verbose

      - name: Locate and Collect Release Artifacts
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_KEY_PASSWORD || '' }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          # 1. Collect NSIS Installer (.exe)
          $setupExe = Get-ChildItem -Path target -Recurse -Filter "*setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setupExe) {
            $setupExe = Get-ChildItem -Path . -Recurse -Filter "*setup.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notlike "*artifacts*" } | Select-Object -First 1
          }
          if ($setupExe) {
            Copy-Item $setupExe.FullName "artifacts/OpenRemote-Windows-x64-Setup.exe"
            Write-Host "Collected Setup: artifacts/OpenRemote-Windows-x64-Setup.exe"
          } else {
            Write-Error "Setup.exe not found!"
            exit 1
          }

          # 2. Collect MSI Installer (.msi)
          $msi = Get-ChildItem -Path target -Recurse -Filter "*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) {
            $msi = Get-ChildItem -Path . -Recurse -Filter "*.msi" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notlike "*artifacts*" } | Select-Object -First 1
          }
          if ($msi) {
            Copy-Item $msi.FullName "artifacts/OpenRemote-Windows-x64.msi"
            Write-Host "Collected MSI: artifacts/OpenRemote-Windows-x64.msi"
          } else {
            Write-Error "MSI installer not found!"
            exit 1
          }

          # 3. Locate or Generate Windows Updater Bundle (.nsis.zip & .sig)
          Write-Host "=== Inspecting Target for Updater Bundles ==="
          Get-ChildItem -Path target -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "*.zip*" -or $_.Name -like "*.sig*" } | Select-Object FullName

          $nsisZip = Get-ChildItem -Path target -Recurse -Filter "*nsis.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          $nsisSig = Get-ChildItem -Path target -Recurse -Filter "*nsis.zip.sig" -ErrorAction SilentlyContinue | Select-Object -First 1

          $msiZip = Get-ChildItem -Path target -Recurse -Filter "*msi.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          $msiSig = Get-ChildItem -Path target -Recurse -Filter "*msi.zip.sig" -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($nsisZip) {
            Copy-Item $nsisZip.FullName "artifacts/OpenRemote-Windows-x64.nsis.zip"
            Write-Host "Collected NSIS Updater: artifacts/OpenRemote-Windows-x64.nsis.zip"
            if ($nsisSig) {
              Copy-Item $nsisSig.FullName "artifacts/OpenRemote-Windows-x64.nsis.zip.sig"
              Write-Host "Collected NSIS Signature: artifacts/OpenRemote-Windows-x64.nsis.zip.sig"
            } elseif (Test-Path "$($nsisZip.FullName).sig") {
              Copy-Item "$($nsisZip.FullName).sig" "artifacts/OpenRemote-Windows-x64.nsis.zip.sig"
              Write-Host "Collected NSIS Signature: artifacts/OpenRemote-Windows-x64.nsis.zip.sig"
            }
          }

          if ($msiZip) {
            Copy-Item $msiZip.FullName "artifacts/OpenRemote-Windows-x64.msi.zip"
            Write-Host "Collected MSI Updater: artifacts/OpenRemote-Windows-x64.msi.zip"
            if ($msiSig) {
              Copy-Item $msiSig.FullName "artifacts/OpenRemote-Windows-x64.msi.zip.sig"
              Write-Host "Collected MSI Signature: artifacts/OpenRemote-Windows-x64.msi.zip.sig"
            } elseif (Test-Path "$($msiZip.FullName).sig") {
              Copy-Item "$($msiZip.FullName).sig" "artifacts/OpenRemote-Windows-x64.msi.zip.sig"
              Write-Host "Collected MSI Signature: artifacts/OpenRemote-Windows-x64.msi.zip.sig"
            }
          }

          # If .nsis.zip was not generated by bundler, package setup.exe into .nsis.zip
          if (-not (Test-Path "artifacts/OpenRemote-Windows-x64.nsis.zip")) {
            Write-Host "Creating artifacts/OpenRemote-Windows-x64.nsis.zip from setup installer..."
            Compress-Archive -Path $setupExe.FullName -DestinationPath "artifacts/OpenRemote-Windows-x64.nsis.zip" -Force
          }

          # If signature file is missing, generate it via tauri signer sign
          if (-not (Test-Path "artifacts/OpenRemote-Windows-x64.nsis.zip.sig")) {
            if ($env:TAURI_SIGNING_PRIVATE_KEY) {
              Write-Host "Signing artifacts/OpenRemote-Windows-x64.nsis.zip using tauri signer..."
              pnpm --dir app-ui tauri signer sign "artifacts/OpenRemote-Windows-x64.nsis.zip"
            } else {
              Write-Warning "TAURI_SIGNING_PRIVATE_KEY not available to sign nsis.zip!"
            }
          }

          # 4. Generate / Update latest.json
          if (Test-Path "artifacts/OpenRemote-Windows-x64.nsis.zip.sig") {
            node scripts/update-latest-json.js `
              windows-x86_64 `
              artifacts/OpenRemote-Windows-x64.nsis.zip.sig `
              OpenRemote-Windows-x64.nsis.zip
          } elseif (Test-Path "artifacts/OpenRemote-Windows-x64.msi.zip.sig") {
            node scripts/update-latest-json.js `
              windows-x86_64 `
              artifacts/OpenRemote-Windows-x64.msi.zip.sig `
              OpenRemote-Windows-x64.msi.zip
          } else {
            Write-Error "No Windows updater signature found! Updater check will fail without a valid signature."
            exit 1
          }

          Write-Host "=== Artifacts Directory Contents ==="
          Get-ChildItem -Path artifacts

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenRemote-Windows-x64
          path: artifacts/*
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
