name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          # Auto-select the installed NDK in ubuntu runner
          if [ -d "$ANDROID_HOME/ndk" ]; then
            LATEST_NDK=$(ls "$ANDROID_HOME/ndk" | sort -V | tail -n 1)
            echo "NDK_HOME=$ANDROID_HOME/ndk/$LATEST_NDK" >> $GITHUB_ENV
            echo "Found NDK: $LATEST_NDK"
          fi

      - name: Install Rust Stable & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Ensure Android Rust Targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Frontend Dependencies
        working-directory: app-ui
        run: pnpm install

      - name: Build SvelteKit Frontend
        working-directory: app-ui
        run: pnpm build

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x app-ui/src-tauri/gen/android/gradlew

      - name: Build Tauri Android APK
        working-directory: app-ui
        run: |
          pnpm tauri android build --apk --verbose

      - name: Locate and Collect Android APK
        run: |
          mkdir -p artifacts

          # Find release APK first, fallback to any universal APK generated
          APK_FILE=$(find app-ui/src-tauri/gen/android/app/build/outputs/apk -type f -name "*release*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app-ui/src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" 2>/dev/null | head -n 1)
          fi

          echo "Found APK: $APK_FILE"
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" artifacts/app-release.apk
            echo "Collected: artifacts/app-release.apk"
          else
            echo "Error: Android APK not found!"
            find app-ui/src-tauri/gen/android/app/build/outputs -type f
            exit 1
          fi

          echo "=== Artifacts Directory Contents ==="
          ls -lh artifacts/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: artifacts/app-release.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
