name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc'
          - name: macOS-AppleSilicon-arm64
            platform: macos-14
            target: aarch64-apple-darwin
            cflags: '-arch arm64'
            args: '--target aarch64-apple-darwin'
          - name: macOS-Intel-x64
            platform: macos-14
            target: x86_64-apple-darwin
            cflags: '-arch x86_64'
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Frontend Dependencies
        working-directory: app-ui
        run: pnpm install

      - name: Build SvelteKit Frontend
        working-directory: app-ui
        run: pnpm build

      - name: Clean previous build artifacts and cache
        shell: bash
        run: |
          echo "=== Cleaning target and artifacts to ensure clean rebuild and signature sync ==="
          rm -rf artifacts
          rm -rf target/release/bundle
          rm -rf target/*/release/bundle
          rm -rf app-ui/src-tauri/target/release/bundle

      - name: Clean up existing mounted disk images (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil info | grep '/Volumes/' | awk '{print $1}' | while read -r dev; do
            hdiutil detach "$dev" -force || true
          done
          rm -rf /tmp/dmg.* || true
          sudo mdutil -i off /tmp || true

      - name: Configure Native Clang Toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "CC=/usr/bin/clang" >> $GITHUB_ENV
          echo "CXX=/usr/bin/clang++" >> $GITHUB_ENV
          echo "AR=/usr/bin/ar" >> $GITHUB_ENV
          echo "CFLAGS=${{ matrix.cflags }}" >> $GITHUB_ENV
          echo "CXXFLAGS=${{ matrix.cflags }}" >> $GITHUB_ENV
          echo "CC_x86_64_apple_darwin=/usr/bin/clang" >> $GITHUB_ENV
          echo "CXX_x86_64_apple_darwin=/usr/bin/clang++" >> $GITHUB_ENV
          echo "CFLAGS_x86_64_apple_darwin=-arch x86_64" >> $GITHUB_ENV
          echo "AR_x86_64_apple_darwin=/usr/bin/ar" >> $GITHUB_ENV
          echo "CC_aarch64_apple_darwin=/usr/bin/clang" >> $GITHUB_ENV
          echo "CXX_aarch64_apple_darwin=/usr/bin/clang++" >> $GITHUB_ENV
          echo "CFLAGS_aarch64_apple_darwin=-arch arm64" >> $GITHUB_ENV
          echo "AR_aarch64_apple_darwin=/usr/bin/ar" >> $GITHUB_ENV

      - name: Build & Publish with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          CI: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_KEY_PASSWORD || '' }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_KEY_PASSWORD || '' }}
        with:
          projectPath: app-ui
          tagName: v__VERSION__
          releaseName: 'OpenRemote v__VERSION__'
          releaseBody: 'OpenRemote v__VERSION__ Release'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: true
