[package]
name = "core-input"
version = "0.1.0"
edition = "2021"

[dependencies]
app-common = { path = "../app-common" }
thiserror = "2.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Gdi"
] }
