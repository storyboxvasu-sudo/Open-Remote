[package]
name = "open-remote-gui"
version = "1.0.27"
description = "High-Performance Cross-Platform Remote Desktop GUI"
edition = "2021"

[lib]
name = "open_remote_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
local-ip-address = "0.6"
tokio-tungstenite = "0.26"
futures-util = "0.3"
parking_lot = "0.12"

# Workspace core dependencies
app-common = { path = "../../crates/app-common" }
core-capture = { path = "../../crates/core-capture" }
core-codec = { path = "../../crates/core-codec" }
core-input = { path = "../../crates/core-input" }
core-net = { path = "../../crates/core-net" }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }
